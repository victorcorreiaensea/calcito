name: Deploy CALCITO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate engines and services
        run: |
          if npm test > /tmp/calcito-tests.log 2>&1; then
            cat /tmp/calcito-tests.log
          else
            cat /tmp/calcito-tests.log
            python3 - <<'PY'
          from pathlib import Path
          report = Path('/tmp/calcito-tests.log').read_text()[-12000:]
          escaped = report.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=CALCITO test failure::{escaped}')
          PY
            exit 1
          fi
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://vxodonurvxzfbwvfvzxr.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_2mbxPqgUHffn8F4D65B43g_viZS8Zaf' }}
      - name: Check public Supabase access
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://vxodonurvxzfbwvfvzxr.supabase.co' }}
          SUPABASE_PUBLIC_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_2mbxPqgUHffn8F4D65B43g_viZS8Zaf' }}
        run: |
          node --input-type=module <<'JS'
          const headers = { apikey: process.env.SUPABASE_PUBLIC_KEY };
          for (const table of ['competitions', 'teams', 'seasons', 'matches', 'admin_users']) {
            const response = await fetch(`${process.env.SUPABASE_URL}/rest/v1/${table}?select=*&limit=1`, { headers });
            if (table === 'admin_users' && [401, 403].includes(response.status)) {
              console.log('admin_users: public access denied as expected');
              continue;
            }
            if (!response.ok) throw new Error(`${table}: HTTP ${response.status}`);
            const rows = await response.json();
            if (!Array.isArray(rows)) throw new Error(`${table}: unexpected response`);
            if (table === 'admin_users' && rows.length) throw new Error('Private administrator records are publicly readable');
            console.log(`${table}: public access checked`);
          }
          const arenaResponse = await fetch(`${process.env.SUPABASE_URL}/rest/v1/rpc/arena_status`, {
            method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: '{}'
          });
          const arena = await arenaResponse.json();
          if (!arenaResponse.ok && arena.code === 'PGRST202') {
            console.log('Arène: frontend ready; migration 003 still needs installation in Supabase');
          } else {
            if (!arenaResponse.ok || arena.installed !== true) throw new Error('Arène readiness check failed');
            console.log(`Arène installed; model enabled: ${arena.enabled}`);
            console.log(`::notice title=Arena readiness::${JSON.stringify({ modelEnabled: arena.enabled, autonomousBookmaker: arena.autonomousBookmaker === true, training: arena.model?.training ?? null, validation: arena.model?.validation ?? null, reason: arena.model?.reason ?? null })}`);
            for (const table of ['arena_wallets', 'arena_tickets', 'arena_ledger']) {
              const privateResponse = await fetch(`${process.env.SUPABASE_URL}/rest/v1/${table}?select=*&limit=1`, { headers });
              if ([401, 403].includes(privateResponse.status)) continue;
              if (!privateResponse.ok) throw new Error(`${table}: unexpected public response`);
              const rows = await privateResponse.json();
              if (!Array.isArray(rows) || rows.length) throw new Error(`${table}: private records are publicly readable`);
            }
            console.log('Arène: private account tables deny anonymous reads');
          }
          JS
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
