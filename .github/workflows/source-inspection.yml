name: Inspect Flashscore public access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Read public access rules without collecting matches
        run: python3 scripts/inspect-flashscore.py
      - name: Check a small historical sample from existing public backend
        run: node scripts/check-real-import-sample.mjs
      - name: Inspect freely licensed dated historical football reference
        run: python3 scripts/check-licensed-football-sample.py
