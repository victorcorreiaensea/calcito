name: Inspect current licensed season references
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        article: [2026–27_Ligue_1, 2026–27_Primeira_Liga, 2026–27_Premier_League, 2026–27_La_Liga, 2026–27_Serie_A, 2026–27_Bundesliga]
    steps:
      - name: Read one ordinary Wikipedia reference
        env:
          ARTICLE: ${{ matrix.article }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,re,gzip,base64
          from html.parser import HTMLParser
          class Text(HTMLParser):
            def __init__(self): super().__init__();self.parts=[];self.skip=0
            def handle_starttag(self,t,a):
              if t in ('script','style'):self.skip+=1
              if t in ('tr','td','th','div','p','br','h2','h3'):self.parts.append('\n')
            def handle_endtag(self,t):
              if t in ('script','style'):self.skip=max(0,self.skip-1)
            def handle_data(self,d):
              if not self.skip:self.parts.append(d)
          url='https://en.wikipedia.org/wiki/'+urllib.parse.quote(os.environ['ARTICLE'])
          try:
            request=urllib.request.Request(url,headers={'User-Agent':'CalcitoSeasonReference/1.0 (read-only CC-BY-SA reference)'})
            with urllib.request.urlopen(request,timeout=20) as r: body=r.read(2000000).decode();status=r.status
            parser=Text();parser.feed(body);visible=re.sub('[ \t]+',' ',''.join(parser.parts))
            data={'url':url,'status':status,'text':visible[:120000]}
          except urllib.error.HTTPError as e: data={'url':url,'status':e.code,'error':'No records inferred; ordinary access only.'}
          except Exception as e:data={'url':url,'error':type(e).__name__,'status':None}
          encoded=base64.b64encode(gzip.compress(json.dumps(data).encode())).decode()
          for start in range(0,min(len(encoded),30000),3000):print('::notice title=Season reference '+str(start)+'::'+encoded[start:start+3000])
          PY
